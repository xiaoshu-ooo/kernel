name: Build 8 KMI KernelSU Calculator

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-8kmi-ksud-manager.yml'
      - 'kernel/**'
      - 'userspace/**'
      - 'manager/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'repack_apk.py'

permissions:
  contents: read

env:
  DDK_RELEASE: '20260828'

# One pipeline:
# 8 KMI -> 16 LKM artifacts -> ksud(aarch64/x86_64) -> jniLibs/libksud.so -> assembleDebug

jobs:
  build-lkm:
    name: Build all 8 KMI LKMs
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size2: ''
      expected_hash2: ''

  build-ksuinit:
    name: Build ksuinit
    uses: ./.github/workflows/ksuinit.yml

  build-ksud-arm64:
    name: Build ksud arm64 with all 8 KMI LKMs
    needs: [build-lkm, build-ksuinit]
    uses: ./.github/workflows/ksud.yml
    with:
      target: aarch64-linux-android
      pack_lkm: true
      pack_ksuinit: true

  build-ksud-x86_64:
    name: Build ksud x86_64 with all 8 KMI LKMs
    needs: [build-lkm, build-ksuinit]
    uses: ./.github/workflows/ksud.yml
    with:
      target: x86_64-linux-android
      pack_lkm: true
      pack_ksuinit: true

  build-debug-apk:
    name: Embed ksud and assemble Debug APK
    needs: [build-ksud-arm64, build-ksud-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-arm64

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64

      - name: Verify ksud artifacts
        shell: bash
        run: |
          set -euo pipefail
          ARM=$(find artifacts/ksud-arm64 -type f -name ksud | head -n1)
          X64=$(find artifacts/ksud-x86_64 -type f -name ksud | head -n1)
          test -n "$ARM"
          test -n "$X64"
          test -s "$ARM"
          test -s "$X64"
          file "$ARM" "$X64"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Embed ksud into manager jniLibs
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ARM=$(find artifacts/ksud-arm64 -type f -name ksud | head -n1)
          X64=$(find artifacts/ksud-x86_64 -type f -name ksud | head -n1)
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          mkdir -p manager/app/src/main/jniLibs/x86_64
          cp -f "$ARM" manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          cp -f "$X64" manager/app/src/main/jniLibs/x86_64/libksud.so
          chmod 755 manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          chmod 755 manager/app/src/main/jniLibs/x86_64/libksud.so
          echo '=== embedded native libraries ==='
          ls -lh manager/app/src/main/jniLibs/arm64-v8a/
          ls -lh manager/app/src/main/jniLibs/x86_64/

      - name: Verify all required native libraries
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            for lib in libkernelsu.so libadbroot.so libksud.so; do
              test -s "manager/app/src/main/jniLibs/$abi/$lib"
            done
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        working-directory: manager
        run: chmod +x ./gradlew

      - name: Assemble Debug APK
        working-directory: manager
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew clean :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK contains ksud for both ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find manager/app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|x86_64)/(libksud|libkernelsu|libadbroot)\.so'

      - name: Upload final Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: KernelSU-Calculator-8KMI-debug
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload embedded jniLibs
        uses: actions/upload-artifact@v7
        with:
          name: KernelSU-Calculator-8KMI-jniLibs
          path: manager/app/src/main/jniLibs/
          if-no-files-found: error
