android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose

android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,BUILD_TOOLS_TOO_LOW
# Termux ARM64: SDK/NDK installation is repaired for arm64-v8a only.
# Do not configure x86_64 here; its linker currently resolves to AArch64 sysroot libraries.

# Temporary calculator shell build
KSU_PACKAGE_NAME=com.coloros.calculator
KSU_NAME=\u8BA1\u7B97\u5668

# Android 37 / Termux build defaults
android.nonTransitiveRClass=false
